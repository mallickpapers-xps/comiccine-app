name: comiccine
description: A cinematic comics reader app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_riverpod: ^2.4.9
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  tflite_flutter: ^0.10.3
  image: ^4.1.3
  archive: ^3.4.9
  pdfx: ^2.6.0
  file_picker: ^6.1.1
  permission_handler: ^11.1.0
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0
  go_router: ^13.0.1
  path: ^1.8.3
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
