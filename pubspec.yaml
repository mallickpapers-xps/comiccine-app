name: comiccine
description: A cinematic comics reader app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.1
  file_picker: ^6.1.1
  go_router: ^13.0.1
  pdfx: ^2.6.0
  photo_view: ^0.15.0
  archive: ^3.4.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
